name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable) + test deps
        # anthropic is needed only because src/harness.py imports it at module level;
        # no test calls any model and no API key is configured.
        run: pip install -e ".[anthropic]" pytest

      - name: Console script works
        run: |
          mh --help
          mh route "Write tests for the critic_check function"

      - name: Offline tests from repo root
        run: python benchmarks/test_offline.py

      - name: Offline tests from inside benchmarks/ (must not depend on cwd)
        working-directory: benchmarks
        run: python test_offline.py

      - name: pytest
        run: python -m pytest -v benchmarks tests
